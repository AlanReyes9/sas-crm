# CRM NEXUS — entorno completo: PostgreSQL + API + Web
#   docker compose up --build
# Web en http://localhost:8080 · API en http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus
      WEB_ORIGIN: http://localhost:8080
      WA_SESSIONS_DIR: /data/wa-sessions
    ports: ["4000:4000"]
    volumes: [wa-sessions:/data/wa-sessions]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  db-data:
  wa-sessions:
